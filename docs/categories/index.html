<script>
function switchTab(containerId, tabIndex) {
  const container = document.getElementById(containerId);
  if (!container) return;
  
  const nav = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-nav') || container.querySelector('.tabs-nav');
  const content = container.querySelector(':scope > .tabs-content') || container.querySelector('.tabs-content');
  if (!nav || !content) return;

  const buttons = Array.from(nav.querySelectorAll(':scope > .tab-button'));
  const panels = Array.from(content.querySelectorAll(':scope > .tab-panel'));
  
  buttons.forEach((btn, idx) => {
    const isActive = (idx === tabIndex);
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  
  panels.forEach((panel, idx) => {
    const isActive = (idx === tabIndex);
    panel.classList.toggle('active', isActive);
    if (isActive) {
      panel.querySelectorAll('.tabs-container').forEach(nested => {
        setTimeout(() => updateTabsScrollButtons(nested), 60);
      });
    }
  });
  
  if (buttons[tabIndex]) {
    buttons[tabIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    setTimeout(() => updateTabsScrollButtons(container), 350);
  }
}
window.switchTab = switchTab;

function scrollTabs(containerId, offset) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const nav = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-nav') || container.querySelector('.tabs-nav');
  if (nav) {
    nav.scrollBy({ left: offset, behavior: 'smooth' });
    setTimeout(() => updateTabsScrollButtons(container), 300);
  }
}
window.scrollTabs = scrollTabs;

function updateTabsScrollButtons(container) {
  if (!container) return;
  const nav = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-nav') || container.querySelector('.tabs-nav');
  const prevBtn = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-scroll-prev');
  const nextBtn = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-scroll-next');
  if (!nav || !prevBtn || !nextBtn) return;

  const maxScrollLeft = nav.scrollWidth - nav.clientWidth;
  const isOverflowing = maxScrollLeft > 3;

  if (!isOverflowing) {
    prevBtn.classList.remove('visible');
    nextBtn.classList.remove('visible');
    return;
  }

  
  prevBtn.classList.toggle('visible', nav.scrollLeft > 4);

  
  nextBtn.classList.toggle('visible', nav.scrollLeft < maxScrollLeft - 4);
}
window.updateTabsScrollButtons = updateTabsScrollButtons;

function initTabs() {
  document.querySelectorAll('.tabs-container').forEach(container => {
    const nav = container.querySelector(':scope > .tabs-nav-wrapper > .tabs-nav') || container.querySelector('.tabs-nav');
    if (nav) {
      nav.addEventListener('scroll', () => {
        updateTabsScrollButtons(container);
      }, { passive: true });
      updateTabsScrollButtons(container);
    }
    
    
    container.querySelectorAll(':scope > .tabs-nav-wrapper > .tabs-scroll-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const offset = parseInt(this.getAttribute('data-scroll') || (this.classList.contains('tabs-scroll-prev') ? '-200' : '200'), 10);
        scrollTabs(container.id, offset);
      });
    });

    
    if (nav) {
      nav.querySelectorAll(':scope > .tab-button').forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const attrIndex = this.getAttribute('data-index');
          const tabIndex = attrIndex !== null ? parseInt(attrIndex, 10) : Array.from(nav.querySelectorAll(':scope > .tab-button')).indexOf(this);
          if (tabIndex >= 0) {
            switchTab(container.id, tabIndex);
          }
        });
      });
    }
  });
}


document.addEventListener('DOMContentLoaded', function() {
  initTabs();
  setTimeout(initTabs, 200);
});

window.addEventListener('load', function() {
  initTabs();
});

window.addEventListener('resize', function() {
  document.querySelectorAll('.tabs-container').forEach(updateTabsScrollButtons);
});
</script>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
